name: Collect sources
# Runs every 30 minutes; each source is only fetched when its own interval is due.
# GitHub may delay or skip scheduled runs under load — the dashboard shows real data age.
on:
  schedule: [{ cron: "7,37 * * * *" }]
  workflow_dispatch:
    inputs:
      force: { description: "Ignore per-source intervals", type: boolean, default: false }
      source: { description: "Only this source id (optional)", required: false, default: "" }
permissions: { contents: read }
concurrency: { group: collect, cancel-in-progress: false }   # never overlap collection jobs

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      SEARCH_PROVIDER: ${{ vars.SEARCH_PROVIDER }}
      SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
      HTTP_USER_AGENT: "AI-RADAR/1.0 (personal dashboard; https://github.com/${{ github.repository }})"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/pyproject.toml }
      - run: pip install ./pipeline
      - name: Sync source/category config
        working-directory: pipeline
        run: python -m airadar.sync
      - name: Collect
        working-directory: pipeline
        run: |
          args=()
          [ "${{ inputs.force }}" = "true" ] && args+=(--force)
          [ -n "${{ inputs.source }}" ] && args+=(--source "${{ inputs.source }}")
          python -m airadar.collect "${args[@]}"
