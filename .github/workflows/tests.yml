name: Tests
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "tests-${{ github.ref }}", cancel-in-progress: true }

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/pyproject.toml }
      - run: pip install -e './pipeline[dev]' 'psycopg[binary]'
      - name: Lint
        run: ruff check pipeline/airadar pipeline/tests
      - name: Unit + mocked integration tests (no network)
        run: python -m pytest -q pipeline/tests
      - name: Migrations + RLS policy tests (real PostgreSQL)
        env: { DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres" }
        run: python -m pytest -q supabase/tests
      - name: Validate source config
        run: cd pipeline && python -m airadar.sync

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Static build (demo mode, under a repo base path)
        env: { NEXT_PUBLIC_BASE_PATH: "/${{ github.event.repository.name }}" }
        run: npm run build
      - run: test -f out/index.html && test -f out/settings/index.html && test -f out/item/index.html
      - name: Secret scan (build output + tracked files)
        run: node ../scripts/check-secrets.mjs out && cd .. && node scripts/check-secrets.mjs --git
      - run: npm audit --omit=dev --audit-level=high
